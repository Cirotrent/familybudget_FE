<h2>Le mie famiglie</h2>

<mat-card *ngFor="let f of families" class="family-card">
  <mat-card-title>{{ f.name }}</mat-card-title>

  <mat-card-content>
    <mat-form-field appearance="outline">
      <mat-label>Username</mat-label>
      <input matInput #username>
    </mat-form-field>

    <button
      mat-raised-button
      color="primary"
      (click)="addMember(f.id, username.value)">
      Aggiungi membro
    </button>
  </mat-card-content>
</mat-card>

<mat-divider></mat-divider>

<h3>Crea nuova famiglia</h3>

<div class="create-family">
  <mat-form-field appearance="outline">
    <mat-label>Nome famiglia</mat-label>
    <input matInput [(ngModel)]="newFamilyName">
  </mat-form-field>

  <button
    mat-raised-button
    color="accent"
    (click)="createFamily()">
    Crea
  </button>
</div>
